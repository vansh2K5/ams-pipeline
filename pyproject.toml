[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ams-pipeline"
version = "0.1.0"
description = "Automated Microservice Synthesis: generate and verify the integration layer between two backend codebases"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Vansh Jangra" }]
dependencies = [
  "tree-sitter>=0.25",
  "tree-sitter-java>=0.23",
  "pydantic>=2.7",
  "httpx>=0.27",
  "ruff>=0.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "fastapi>=0.110"]

[project.scripts]
ams = "ams.cli:main"

[tool.setuptools.packages.find]
include = ["ams*"]

[tool.ruff]
line-length = 120
extend-exclude = ["examples", "build", "ams-out"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "PLW1510", "ISC"]

[tool.pytest.ini_options]
testpaths = ["tests"]
