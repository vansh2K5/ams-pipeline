name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check ams tests
      - run: pytest -q

  pipeline-and-security:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install AMS and the five scanners
        run: |
          pip install -e . semgrep checkov
          curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          GITLEAKS=8.28.0
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS}/gitleaks_${GITLEAKS}_linux_x64.tar.gz" | tar -xz -C /usr/local/bin gitleaks
          curl -sSfL -o /usr/local/bin/osv-scanner https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64
          chmod +x /usr/local/bin/osv-scanner
      - name: Run the full pipeline on the examples (deterministic mode)
        run: ams run --provider examples/order-service --consumer examples/billing-service --out ams-out --no-llm
      - name: Publish report to the job summary
        if: always()
        run: cat ams-out/ams-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ams-report
          path: ams-out/
      - name: Stage the HTML report for GitHub Pages
        if: always() && github.ref == 'refs/heads/main'
        run: mkdir -p site && cp ams-out/ams-report.html site/index.html
      - uses: actions/upload-pages-artifact@v3
        if: always() && github.ref == 'refs/heads/main'
        with:
          path: site

  publish-report:
    needs: pipeline-and-security
    if: always() && github.ref == 'refs/heads/main' && needs.pipeline-and-security.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
